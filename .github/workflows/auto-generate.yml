name: Auto Generate (청약홈 매일 자동생성·만료종료·재배포)

# 매일 06:00 KST: 청약홈 실데이터 fetch → SSOT 갱신(신규추가·만료종료) →
#   sitemap/lastmod 재생성 → 신규 상세 생성 → 전체 게이트 통과 시에만 commit/push → IndexNow.
# 실패 시에만 theassetsquare@gmail.com 메일(성공 메일 0).
#
# === 사장님 1회 액션(무인가동 전제 — 코드로는 불가, 등록만 필요) ===
#   repo Settings → Secrets and variables → Actions 에 등록:
#     DATA_GO_KR_KEY  : 공공데이터포털(data.go.kr) "한국부동산원_청약홈 분양정보" 무료 인증키
#     RESEND_API_KEY  : (이미 사용 중이면 재사용) 실패 알림 메일용
#   그리고 repo Settings → Actions → General → Workflow permissions = "Read and write"
#   (위 등록 전까지: 키 없으면 fetch 생략 = 변경 0 으로 안전하게 no-op, 사이트 무손상)

on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: SSOT 갱신 (청약홈 fetch · 신규추가 · 만료종료)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node tools/update-listings.mjs

      - name: 신규 현장 상세 생성 (SSOT 실데이터 기반 · 미존재분만)
        run: node tools/new-listing.mjs --all

      - name: sitemap·lastmod 재생성 (SSOT 기준)
        run: node tools/sitemap.mjs

      - name: 전체 게이트 통과 검증 (위반 시 배포 중단)
        run: |
          node tools/debug.mjs --ci
          node tools/seo-audit.mjs --ci
          node tools/stuffing.mjs --ci
          node tools/normalize.mjs --check

      - name: 변경 시에만 commit & push
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "auto-generate-bot"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "auto: 청약홈 갱신·재생성 $(date -u +%F)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "변경 없음 — 배포 생략"; echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: IndexNow 핑 (변경 배포 시)
        if: steps.commit.outputs.pushed == 'true'
        run: node tools/indexnow.mjs

      - name: 실패 알림 메일 (실패 시에만)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: 'theassetsquare@gmail.com'
        run: node tools/notify.mjs "❌ realestate2 자동생성 실패" "auto-generate 워크플로 실패 — 로그 확인 필요"
